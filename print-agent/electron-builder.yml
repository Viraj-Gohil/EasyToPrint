appId: com.printflow.agent
productName: EasyToPrint Agent
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/**/*
  - package.json
win:
  icon: build/icon.ico
  executableName: EasyToPrint Agent
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: EasyToPrint-Agent-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EasyToPrint Agent
  uninstallDisplayName: EasyToPrint Agent
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
publish:
  provider: generic
  url: https://printflow.cloud/downloads/agent/
